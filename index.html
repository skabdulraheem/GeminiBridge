<!DOCTYPE html>
<html>
<head>
    <title>AI ChatBot</title>
    <meta charset="UTF-8">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg,#0d6efd,#6610f2);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chat-box {
            width: 500px;
            height: 650px;
            background: white;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }

        .chat-header {
            background: #0d6efd;
            color: white;
            padding: 15px;
            font-weight: bold;
            text-align: center;
        }

        .chat-body {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            background: #f8f9fa;
        }

        .message {
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 10px;
            max-width: 75%;
        }

        .user {
            background: #0d6efd;
            color: white;
            margin-left: auto;
        }

        .bot {
            background: #e9ecef;
        }

        .chat-footer {
            padding: 10px;
            border-top: 1px solid #ddd;
        }
    </style>
</head>
<body>

<div class="chat-box">
    <div class="chat-header">🤖 Local AI ChatBot (Ollama)</div>

    <div class="chat-body" id="chatBody">
        <div class="message bot">Hello! Type a message.</div>
    </div>

    <div class="chat-footer">
        <div class="input-group">
            <input type="text" id="userInput" class="form-control" placeholder="Type here...">
            <button class="btn btn-primary" onclick="sendMessage()">Send</button>
        </div>
    </div>
</div>

<script>

async function sendMessage() {

    let input = document.getElementById("userInput");
    let message = input.value.trim();

    if (message === "") return;

    let chatBody = document.getElementById("chatBody");

    // ----- Add User Message -----
    let userDiv = document.createElement("div");
    userDiv.className = "message user";
    userDiv.innerText = message;
    chatBody.appendChild(userDiv);

    chatBody.scrollTop = chatBody.scrollHeight;
    input.value = "";

    let lower = message.toLowerCase();

    // -------- SOCIAL MEDIA COMMANDS --------

    const sites = {
        "open google": "https://google.com",
        "open youtube": "https://youtube.com",
        "open instagram": "https://instagram.com",
        "open facebook": "https://facebook.com",
        "open github": "https://github.com",
        "open amazon": "https://amazon.com",
        "open flipkart": "https://flipkart.com"
    };

    if (sites[lower]) {
        window.open(sites[lower], "_blank");
        return;
    }

    // ----- Thinking bubble -----
    let botDiv = document.createElement("div");
    botDiv.className = "message bot";
    botDiv.innerText = "Thinking...";
    chatBody.appendChild(botDiv);
    chatBody.scrollTop = chatBody.scrollHeight;

    try {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 60000); // 20s timeout

        const response = await fetch(
            "http://localhost:8080/api/ai/chat?prompt=" + encodeURIComponent(message),
            { signal: controller.signal }
        );

        clearTimeout(timeout);

        // Handle HTTP errors explicitly
        if (!response.ok) {
            const errText = await response.text();
            botDiv.innerText = `Server error (${response.status}): ${errText}`;
            return;
        }

        const data = await response.text();
        botDiv.innerText = data || "No response from AI.";

    } catch (error) {
        if (error.name === "AbortError") {
            botDiv.innerText = "Request timed out (AI is slow locally).";
        } else {
            botDiv.innerText = "Cannot reach backend. Make sure:\n- Spring Boot is running\n- Ollama is running\n- Port is correct";
        }

        console.error("Chat error:", error);
    }chatBody.scrollTop = chatBody.scrollHeight;
    }

   


</script>
</body>
</html>
